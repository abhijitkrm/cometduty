name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o cometduty ./cmd/cometduty
      - run: ./cometduty example-config > /tmp/example.yml
      - run: ./cometduty validate -f /tmp/example.yml --chains-dir /nonexistent
      - run: ./cometduty version
