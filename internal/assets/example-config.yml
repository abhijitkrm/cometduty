---
# cometduty example configuration — a community maintained missed-block monitor
# for CometBFT chains (incl. Cosmos-EVM). Field names are compatible with
# tenderduty v2 configs where practical.

# ---- global alert knobs ----
node_down_alert_minutes: 3
node_down_alert_severity: critical
flap_suppression_minutes: 10   # re-alerts sooner than this after a resolve are suppressed
reminder_minutes: 0            # >0 re-notifies on still-open alerts at this interval

# ---- prometheus ----
prometheus_enabled: yes
prometheus_listen_port: 28686
prometheus_bind: 0.0.0.0

# ---- notifiers (global) ----
pagerduty:
  enabled: no
  api_key: ${PD_ROUTING_KEY}   # V2 events API routing key
  default_severity: error

discord:
  enabled: no
  webhook: https://discord.com/api/webhooks/xxx/yyy
  mentions: ["<@123456789>"]

telegram:
  enabled: no
  api_key: "555:AAAA"          # from @BotFather
  channel: "-666666666"        # group/channel id
  mentions: ["@oncall"]

slack:
  enabled: no
  webhook: https://hooks.slack.com/services/AAA/BBB
  mentions: ["<!channel>"]

# generic JSON webhook — body is a Go template over the alert object:
#   {{.Chain}} {{.ChainID}} {{.Severity}} {{.Message}} {{.Moniker}} {{.Valcons}}
#   {{.Resolved}} {{.Time}} {{.Fields.endpoint}} etc.
webhook:
  enabled: no
  url: https://example.com/hook
  # template_body: '{"text":"{{.Chain}}: {{.Message}}"}'
  # headers: {Authorization: "Bearer x"}

ntfy:
  enabled: no
  url: https://ntfy.sh         # or your self-hosted instance
  topic: my-validator-alerts
  priority: high
  # token: tk_xxx

opsgenie:
  enabled: no
  api_key: ${OPSGENIE_KEY}
  # api_url: https://api.eu.opsgenie.com
  # team: sre

# dead-man's-switch ping for the monitor itself (healthchecks.io, etc.)
healthcheck:
  enabled: no
  ping_url: https://hc-ping.com/aaaa-bbbb
  ping_rate: 60                # seconds

# ---- chains ----
# chain-specific files can also live in chains.d/<Friendly Name>.yml
chains:
  "Osmosis":
    chain_id: osmosis-1
    # role decides which alert classes this instance owns when several
    # cometduty processes watch one chain:
    #   standalone (default) — every alert class
    #   sidecar    — node-local + validator signing alerts; suppresses
    #                chain-wide alerts (stalled, no-servers, set-watch)
    #   chain      — chain-wide alerts only (the central instance)
    # role: standalone
    # single validator shorthand:
    valoper_address: osmovaloper1xxxx...
    # OR a direct consensus address (ICS consumer chains etc.):
    # valcons_override: osmovalcons1xxxx...
    # cons_prefix: osmovalcons   # only needed when derivation fails
    # label: main
    # multi-validator on one chain:
    # validators:
    #   - valoper_address: osmovaloper1aaa...
    #     label: primary
    #   - valoper_address: osmovaloper1bbb...
    #     label: backup
    # slashing_enabled: false    # chains without x/slashing (auto-detected anyway)
    public_fallback: no        # fall back to chain-registry public RPCs

    alerts:
      stalled_enabled: yes
      stalled_minutes: 10

      consecutive_enabled: yes
      consecutive_missed: 5
      consecutive_priority: critical

      percentage_enabled: no
      percentage_missed: 10
      percentage_priority: warning

      alert_if_inactive: yes
      alert_if_no_servers: yes

      lag_enabled: yes         # new: node falls behind head
      lag_blocks: 100

      # EVM execution layer (only when evm_rpc is set on the chain):
      evm_down_enabled: yes    # evm_rpc unreachable
      evm_lag_enabled: yes     # execution behind consensus
      evm_lag_blocks: 30       # comet height - eth_blockNumber

      # Consensus/EVM internals — metrics always exported; nonzero = also alert.
      mempool_txs_alert: 0        # node mempool backlog > N txs (CheckTx/exec wedge)
      consensus_round_alert: 0    # node consensus round > N (leader churn)
      evm_txpool_queued_alert: 0  # evm txpool queued > N (nonce gap / stall)

      # Validator-set watch — any validator, not just monitored ones:
      set_watch_enabled: no       # validator-new / validator-gone / validator-jailed
      stake_change_pct: 0         # monitored validator bonded stake moved >N%

      # Host stats via the node's own prometheus endpoint (needs metrics_url):
      cpu_pct_alert: 0            # node cpu >N% (per-core; >100 possible)
      mem_bytes_alert: 0          # node resident memory >N bytes

      # Catching-up (block sync in progress) — on by default, auto-resolves.
      # A syncing node suppresses node-down so one problem doesn't page twice.
      # catching_up_enabled: yes        # set no to silence
      catching_up_severity: warning     # severity for the catching-up alert
      catching_up_grace_minutes: 0      # must be syncing this long first (0 = immediate)
      catching_up_stuck_minutes: 15     # syncing + height unmoved > N min → critical (0 = off)

      # Local checks — need the node's home dir mounted read-only (node home:):
      disk_free_bytes_alert: 0          # home filesystem free < N bytes → warning
      signer_stall_minutes: 0           # priv_validator_state unmoved > N min while
                                        # the chain advances → warning (bad key, wedged signer)

      # per-chain destination overrides (enabled + credentials):
      pagerduty: {enabled: yes}
      discord:   {enabled: yes}
      telegram:  {enabled: no}
      slack:     {enabled: no}
      webhook:   {enabled: no}
      ntfy:      {enabled: no}
      opsgenie:  {enabled: no}

    evm_rpc: http://localhost:8545   # optional: EVM JSON-RPC — enables execution-layer checks

    nodes:
      - url: tcp://localhost:26657
        name: local sentry      # shown instead of the raw URL
        alert_if_down: yes
        # validator: validator-01   # moniker of the validator this node serves — adds a
                                    # `validator` label to node metrics (per-validator views)
        # evm_rpc: http://localhost:8545   # this node's own EVM endpoint — per-validator
                                          # execution checks (txpool/lag labeled by validator)
        # metrics_url: http://localhost:26660  # node's own prometheus endpoint — enables cpu/mem stats
        # home: /node-home               # read-only mount of the node's home dir —
                                        # enables disk-free + priv_validator_state checks
      - url: https://rpc2.example.com:443
        alert_if_down: no
        # insecure_tls: yes      # self-signed certs
        # headers: {Authorization: "Bearer ${RPC_TOKEN}"}
      # unix:///var/run/comet.sock  # UDS is supported for local nodes
