<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="865" viewBox="0 0 1920 865" role="img" aria-labelledby="t d">
<title id="t">cometduty</title>
<desc id="d">Monitoring and alerting for Cosmos-EVM validators. Shooting stars cross a twilight sky.</desc>
<style>
@font-face{font-family:"SG";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"SG";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"PM";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
.sg{font-family:"SG","Space Grotesk","Helvetica Neue",Arial,sans-serif}
.pm{font-family:"PM","IBM Plex Mono",ui-monospace,Menlo,monospace}
.meteor{opacity:0;animation:shoot 7s linear infinite}
.m2{animation-delay:1.2s}.m3{animation-delay:2.6s}.m4{animation-delay:3.7s}.m5{animation-delay:4.9s}.m6{animation-delay:6.1s}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}3%{opacity:1}18%{transform:translate(-460px,193px);opacity:0}100%{transform:translate(-460px,193px);opacity:0}}
.tw{animation:twinkle 3.2s ease-in-out infinite}.tw2{animation-delay:1.1s}.tw3{animation-delay:2.2s}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.meteor{animation:none;opacity:.85}.tw{animation:none}}
</style>
