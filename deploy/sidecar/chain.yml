# cometduty chain-role config — the ONE central instance next to the sidecars.
# Owns chain-wide alerts only: stalled chain, no-working-RPC, validator-set
# changes. Node-local and validator-signing pages come from the sidecars.

prometheus_enabled: yes
prometheus_listen_port: ${METRICS_PORT}
node_down_alert_minutes: 3
flap_suppression_minutes: 15

api_token: ${API_TOKEN}

webhook:
  enabled: ${WEBHOOK_ENABLED}
  url: ${WEBHOOK_URL}
  secret: ${WEBHOOK_SECRET}

chains:
  "${CHAIN_NAME}":
    chain_id: ${CHAIN_ID}
    role: chain

    alerts:
      stalled_enabled: yes
      stalled_minutes: 2
      alert_if_no_servers: yes
      set_watch_enabled: yes          # validator-new / validator-gone / validator-jailed
      # everything else stays off here — the sidecars page for those
      webhook: {enabled: yes}       # on when the global webhook is on

    # every node's RPC as a data source — no alert_if_down, the sidecars own
    # node-down paging. One entry per node; labels travel with its alerts.
    nodes:
      - url: http://10.0.0.11:26657
        name: validator-1
        validator: validator-1
        # labels: {profile: validator-1}
      - url: http://10.0.0.12:26657
        name: validator-2
        validator: validator-2
