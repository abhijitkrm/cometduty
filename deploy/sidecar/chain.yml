# cometduty chain-role config — the ONE central instance next to the sidecars.
# Owns chain-wide alerts only: stalled chain, no-working-RPC, validator-set
# changes. Node-local and validator-signing pages come from the sidecars.

prometheus_enabled: yes
prometheus_listen_port: ${METRICS_PORT}
node_down_alert_minutes: 3
flap_suppression_minutes: 15

webhook:
  enabled: no
  # url: https://hooks.example.com/cometduty

chains:
  "${CHAIN_NAME}":
    chain_id: ${CHAIN_ID}
    role: chain

    alerts:
      stalled_enabled: yes
      stalled_minutes: 2
      alert_if_no_servers: yes
      set_watch_enabled: yes          # validator-new / validator-gone / validator-jailed
      # everything else stays off here — the sidecars page for those
      webhook: {enabled: no}

    # all validator RPC endpoints as data sources — no alert_if_down, the
    # sidecars own node-down paging.
    nodes:
      - url: ${NODE0_RPC}
        name: validator-0
        validator: validator-01
      - url: ${NODE1_RPC}
        name: validator-1
        validator: validator-02
      - url: ${NODE2_RPC}
        name: validator-2
        validator: validator-03
      - url: ${NODE3_RPC}
        name: validator-3
        validator: validator-04
