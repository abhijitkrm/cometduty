# cometduty sidecar config — one instance per validator.
#
# Every ${VAR} below is expanded by cometduty at load time (ExpandEnv), so a
# single file serves all sidecars; each container/process just sets different
# env. URLs are full endpoints — point them at container DNS names when the
# sidecar shares the validator network, or at host:port when running natively.
#
# The sidecar reads the node's home dir (NODE_HOME, read-only) for disk-free
# and priv_validator_state checks, and tails the node's container logs through
# DOCKER_HOST — use a read-only socket proxy (tecnativa/docker-socket-proxy),
# NOT the raw socket, on any host you don't fully control.

prometheus_enabled: yes
prometheus_listen_port: ${METRICS_PORT}
node_down_alert_minutes: 3
node_down_alert_severity: critical
flap_suppression_minutes: 15

# Destinations — enable one and set credentials via env.
webhook:
  enabled: no
  # url: https://hooks.example.com/cometduty

chains:
  "${CHAIN_NAME}":
    chain_id: ${CHAIN_ID}
    role: sidecar          # node-local + validator signing alerts only —
                           # chain-wide alerts are the central instance's job
    valoper_address: ${VALOPER}
    label: ${VALIDATOR}

    alerts:
      consecutive_enabled: yes
      consecutive_missed: 15
      consecutive_priority: critical
      percentage_enabled: yes
      percentage_missed: 10
      percentage_priority: warning
      alert_if_inactive: yes       # jailed / tombstoned / unbonded
      alert_if_no_servers: no      # chain-wide — leave to role: chain

      lag_enabled: yes             # node behind head
      lag_blocks: 100

      evm_down_enabled: yes        # this node's own evm_rpc unreachable
      evm_lag_enabled: yes         # execution behind consensus
      evm_lag_blocks: 30

      catching_up_severity: warning
      catching_up_grace_minutes: 2      # brief restarts sync quietly
      catching_up_stuck_minutes: 15     # syncing but height frozen → critical

      disk_free_bytes_alert: 5368709120 # 5 GiB on the home filesystem
      signer_stall_minutes: 5           # priv_validator_state unmoved while chain advances

      # internals — metrics always on; nonzero here also alerts
      mempool_txs_alert: 0
      consensus_round_alert: 0
      evm_txpool_queued_alert: 0
      cpu_pct_alert: 0
      mem_bytes_alert: 0

      webhook: {enabled: no}       # enable + url to receive this sidecar's alerts

    nodes:
      - url: ${NODE_RPC}                 # e.g. tcp://primium-validator0:26657 | tcp://localhost:28657
        name: ${VALIDATOR}
        validator: ${VALIDATOR}          # joins node metrics to the validator
        evm_rpc: ${NODE_EVM}             # e.g. http://primium-validator0:8545
        metrics_url: ${NODE_METRICS}     # node's own prometheus endpoint base (:26660)
        home: ${NODE_HOME}               # read-only mount / host dir of node home
        alert_if_down: yes
        logs:
          enabled: yes
          source: docker                 # docker | file
          docker_host: ${DOCKER_HOST}    # tcp://proxy:2375 or unix:///var/run/docker.sock
          container: ${NODE_CONTAINER}   # the validator's container name
          tail: 100                      # lines scanned back on first connect
          # extra rules on top of the built-in pack:
          # rules:
          #   - name: my-pattern
          #     pattern: "something went sideways"
          #     severity: warning
          #     count: 5
          #     window_minutes: 2
          #     cooldown_minutes: 30
