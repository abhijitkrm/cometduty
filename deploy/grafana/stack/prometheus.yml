global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Targets are reached through host.docker.internal: the ports cometduty and
# your nodes publish on the docker host. (Built into Docker Desktop; compose.yml
# maps it via extra_hosts on Linux engines.) If Prometheus shares a docker
# network with them instead, use container DNS names (e.g. my-node:26660).
#
# Defaults: one cometduty instance on its default :28686 and one node on the
# stock CometBFT (:26660) and EVM exporter (:8100) ports. Multi-node and
# sidecar layouts are sketched in the comments of each job.
#
# After editing: docker compose restart prometheus, then check every target
# is UP at http://localhost:9091/targets.
scrape_configs:
  - job_name: cometduty
    static_configs:
      # Single instance monitoring every validator from one config. Its series
      # already carry a `moniker` label per validator — no labels needed here.
      - targets: ["host.docker.internal:28686"]
      # Sidecar deployment (deploy/sidecar/): replace the target above with
      # one per sidecar, plus the chain-role instance:
      # - targets: ["host.docker.internal:28700"]
      #   labels: {validator: validator-01}
      # - targets: ["host.docker.internal:28701"]
      #   labels: {validator: validator-02}
      # - targets: ["host.docker.internal:28704"]
      #   labels: {role: chain}

  # Each node's own CometBFT metrics (config.toml: prometheus = true).
  - job_name: cometbft
    static_configs:
      - targets: ["host.docker.internal:26660"]
        labels: {validator: validator-01}
      # More nodes on one host publish on distinct host ports, e.g.:
      # - targets: ["host.docker.internal:26670"]
      #   labels: {validator: validator-02}

  # EVM execution-layer exporter on each node (in-container :8100) — chain
  # head, reorgs, db caches, p2p discovery, rpc latencies. Txpool depth and
  # block fullness come from cometduty itself. Drop this job for non-EVM chains.
  - job_name: evm
    static_configs:
      - targets: ["host.docker.internal:8100"]
        labels: {validator: validator-01}
      # - targets: ["host.docker.internal:8110"]
      #   labels: {validator: validator-02}

  # Host CPU/disk/mem/load. CometBFT/EVM metrics don't carry kernel-level
  # host stats — a full disk is a top validator killer, and no RPC exposes it.
  # The bundled node-exporter service (compose.yml) covers the docker host;
  # add one node_exporter per additional validator host.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {host: docker-host}
      # - targets: ["validator-02-host:9100"]
      #   labels: {host: validator-02-host}
