# Local observability stack: Prometheus scrapes cometduty (running on the
# host) plus each validator's own CometBFT metrics; Grafana serves the bundled
# dashboard. `docker compose -f deploy/grafana/stack/compose.yml up -d`
#
#   Grafana:    http://localhost:3000  (admin / cometduty)
#   Prometheus: http://localhost:9090
#   Loki:       http://localhost:3100  (container logs via Alloy)
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: cometduty
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Infinity datasource — direct RPC queries for the table panels
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # Loki: log storage/search. cometduty stays the detection layer — Loki is
  # the "what did the logs say around the incident" answer.
  loki:
    image: grafana/loki:3.4.2
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # Alloy: tails docker container logs → Loki (replaces promtail).
  # The socket mount is read-only; container logs only.
  alloy:
    image: grafana/alloy:v1.5.1
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "12345:12345"   # alloy UI (component graph, debug) — drop if unwanted
    depends_on:
      - loki

volumes:
  prom-data: {}
  grafana-data: {}
  loki-data: {}
