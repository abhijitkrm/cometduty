# Create ./config.yml before `docker compose up` — a missing bind-mount source
# is created as an empty directory, and cometduty will refuse to start:
#   docker run --rm --entrypoint /cometduty ghcr.io/abhijitkrm/cometduty:latest example-config > config.yml
services:
  cometduty:
    image: ghcr.io/abhijitkrm/cometduty:latest
    restart: unless-stopped
    volumes:
      - ./config.yml:/config/config.yml:ro
      - ./chains.d:/etc/cometduty/chains.d:ro   # optional per-chain files
      - cometduty-data:/data
    ports:
      - "28686:28686"   # prometheus
    environment:
      # referenced from config.yml via ${VAR} expansion
      - PD_ROUTING_KEY=${PD_ROUTING_KEY:-}
      - TG_BOT_KEY=${TG_BOT_KEY:-}

volumes:
  cometduty-data:
